<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" role="img" aria-labelledby="title desc">
  <title id="title">Unknowns become architectural evidence</title>
  <desc id="desc">A decision moves through assumptions and real interaction to failure, observable evidence, and a revised contract that informs the next decision.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52657a"/></marker><style>.node{fill:#f7f9fc;stroke:#8ea0b3;stroke-width:2}.text{fill:#172033;font:600 15px system-ui,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <path class="edge" d="M190 110H238"/><path class="edge" d="M420 110H468"/><path class="edge" d="M650 110H698"/><path class="edge" d="M880 110H928"/><path class="edge" d="M1110 110H1158"/><path class="edge" d="M1240 70V30H105V70"/>
  <rect class="node" x="20" y="70" width="170" height="80" rx="14"/><rect class="node" x="250" y="70" width="170" height="80" rx="14"/><rect class="node" x="480" y="70" width="170" height="80" rx="14"/><rect class="node" x="710" y="70" width="170" height="80" rx="14"/><rect class="node" x="940" y="70" width="170" height="80" rx="14"/><rect class="node" x="1170" y="70" width="170" height="80" rx="14"/>
  <g class="text"><text x="105" y="113">Decision</text><text x="335" y="102"><tspan x="335">Implicit</tspan><tspan x="335" dy="21">assumptions</tspan></text><text x="565" y="102"><tspan x="565">Real</tspan><tspan x="565" dy="21">interaction</tspan></text><text x="795" y="102"><tspan x="795">Failure or</tspan><tspan x="795" dy="21">unexpected signal</tspan></text><text x="1025" y="102"><tspan x="1025">Observable</tspan><tspan x="1025" dy="21">evidence</tspan></text><text x="1255" y="102"><tspan x="1255">Revised contract</tspan><tspan x="1255" dy="21">or boundary</tspan></text></g>
</svg>
