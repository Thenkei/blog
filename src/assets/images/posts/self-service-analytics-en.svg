<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="self-service-analytics-en-title self-service-analytics-en-desc">
  <title id="self-service-analytics-en-title">Governed self-service analytics flow</title>
  <desc id="self-service-analytics-en-desc">A business question is planned against a certified catalog. A certified mart follows a guarded read-only path to a provenance-backed answer; a gap enters lineage, testing, and certification before it becomes reusable.</desc>
  <defs>
    <pattern id="self-service-analytics-en-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" class="inline-grid-line" />
    </pattern>
    <marker id="self-service-analytics-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow" />
    </marker>
    <marker id="self-service-analytics-en-arrow-hot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow-hot" />
    </marker>
    <marker id="self-service-analytics-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow-link" />
    </marker>
    <style><![CDATA[
      .inline-paper { fill: var(--visual-surface, #edf3ff); }
      .inline-grid-line { fill: none; stroke: var(--visual-grid, rgba(18,36,63,.08)); stroke-width: 1; }
      .inline-node { fill: var(--visual-surface-strong, #fff); stroke: color-mix(in srgb, var(--visual-ink, #12243f) 32%, transparent); stroke-width: 1.5; }
      .inline-node-hot { fill: color-mix(in srgb, var(--visual-hot, #c86c18) 14%, var(--visual-surface-strong, #fff)); stroke: var(--visual-hot, #c86c18); stroke-width: 2; }
      .inline-node-success { fill: color-mix(in srgb, var(--visual-line-secondary, #17aa7b) 12%, var(--visual-surface-strong, #fff)); stroke: var(--visual-line-secondary, #17aa7b); stroke-width: 1.5; }
      .inline-route { fill: none; stroke: var(--visual-line, #1d8fe1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#self-service-analytics-en-arrow); }
      .inline-route-muted { stroke: var(--visual-muted, #486189); }
      .inline-route-hot { stroke: var(--visual-hot, #c86c18); marker-end: url(#self-service-analytics-en-arrow-hot); }
      .inline-arrow { fill: var(--visual-line, #1d8fe1); }
      .inline-arrow-hot { fill: var(--visual-hot, #c86c18); }
      .inline-arrow-link { fill: var(--visual-line-secondary, #17aa7b); }
      .inline-name { fill: var(--visual-ink, #12243f); font: 600 16px var(--font-display, 'Space Grotesk', sans-serif); text-anchor: middle; }
      .inline-eyebrow { fill: var(--visual-muted, #486189); font: 500 8px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .16em; }
      .inline-branch { fill: var(--visual-hot, #c86c18); font: 600 12px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .06em; }
      .inline-mask { fill: var(--visual-surface, #edf3ff); }
      .inline-rule { stroke: color-mix(in srgb, var(--visual-ink, #12243f) 18%, transparent); stroke-width: 1; }
      .inline-legend { fill: var(--visual-muted, #486189); font: 400 8px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .04em; }
    ]]></style>
  </defs>

  <rect width="900" height="480" class="inline-paper" />
  <rect width="900" height="480" fill="url(#self-service-analytics-en-grid)" opacity=".7" />
  <text x="40" y="36" class="inline-eyebrow">SELF-SERVICE · SEMANTICS BEFORE SPEED</text>

  <path d="M164 168H196" class="inline-route inline-route-muted" />
  <path d="M340 168H364" class="inline-route inline-route-muted" />
  <path d="M436 168H468" class="inline-route" />
  <path d="M612 168H656" class="inline-route" />
  <path d="M400 204V252Q400 260 392 260H292Q284 260 284 268V332H300" class="inline-route inline-route-muted" />
  <path d="M436 332H456" class="inline-route inline-route-muted" />
  <path d="M600 332H624" class="inline-route inline-route-muted" />
  <path d="M768 332H792" class="inline-route" />

  <rect x="40" y="132" width="124" height="72" rx="8" class="inline-node" />
  <rect x="196" y="132" width="144" height="72" rx="8" class="inline-node" />
  <polygon points="400,132 436,168 400,204 364,168" class="inline-node-hot" />
  <rect x="468" y="132" width="144" height="72" rx="8" class="inline-node" />
  <rect x="656" y="132" width="196" height="72" rx="8" class="inline-node-success" />
  <rect x="300" y="296" width="136" height="72" rx="8" class="inline-node" />
  <rect x="456" y="296" width="144" height="72" rx="8" class="inline-node" />
  <rect x="624" y="296" width="144" height="72" rx="8" class="inline-node" />
  <rect x="792" y="296" width="80" height="72" rx="8" class="inline-node-success" />

  <text x="102" y="160" class="inline-name"><tspan x="102">BUSINESS</tspan><tspan x="102" dy="20">QUESTION</tspan></text>
  <text x="268" y="160" class="inline-name"><tspan x="268">PLAN +</tspan><tspan x="268" dy="20">CATALOG</tspan></text>
  <text x="400" y="164" class="inline-name"><tspan x="400">IN</tspan><tspan x="400" dy="20">MARTS?</tspan></text>
  <text x="540" y="160" class="inline-name"><tspan x="540">GUARDED</tspan><tspan x="540" dy="20">QUERY</tspan></text>
  <text x="754" y="160" class="inline-name"><tspan x="754">ANSWER +</tspan><tspan x="754" dy="20">PROVENANCE</tspan></text>
  <text x="368" y="324" class="inline-name"><tspan x="368">MODEL</tspan><tspan x="368" dy="20">GAP</tspan></text>
  <text x="528" y="324" class="inline-name"><tspan x="528">LINEAGE +</tspan><tspan x="528" dy="20">CONTRACT</tspan></text>
  <text x="696" y="324" class="inline-name"><tspan x="696">MODEL +</tspan><tspan x="696" dy="20">TESTS</tspan></text>
  <text x="832" y="324" class="inline-name"><tspan x="832">CERTIFY</tspan></text>

  <rect x="444" y="144" width="32" height="16" rx="2" class="inline-mask" />
  <text x="452" y="156" class="inline-branch">YES</text>
  <rect x="408" y="228" width="28" height="16" rx="2" class="inline-mask" />
  <text x="416" y="240" class="inline-branch">NO</text>

  <line x1="40" y1="408" x2="860" y2="408" class="inline-rule" />
  <text x="40" y="436" class="inline-eyebrow">READING KEY</text>
  <line x1="160" y1="432" x2="196" y2="432" class="inline-route" />
  <text x="208" y="436" class="inline-legend">CERTIFIED READ PATH</text>
  <rect x="392" y="424" width="16" height="16" rx="2" class="inline-node-hot" />
  <text x="420" y="436" class="inline-legend">SEMANTIC DECISION</text>
  <rect x="632" y="424" width="16" height="16" rx="2" class="inline-node-success" />
  <text x="660" y="436" class="inline-legend">REUSABLE OUTPUT</text>
</svg>
