<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">Governed self-service analytics flow</title>
  <desc id="desc">A business question is checked against certified marts; it either follows a guarded read-only query path or enters a reviewed modeling path before returning to the catalog.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52657a"/></marker><style>.node{fill:#f7f9fc;stroke:#8ea0b3;stroke-width:2}.decision{fill:#fff7e8;stroke:#d58a35;stroke-width:2}.text{fill:#172033;font:600 14px system-ui,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#arrow)}.branch{fill:#9a5a18;font:600 13px system-ui,sans-serif}</style></defs>
  <path class="edge" d="M190 100H248"/><path class="edge" d="M440 100H498"/><path class="edge" d="M660 100H718"/><path class="edge" d="M910 100H968"/><path class="edge" d="M1160 100H1218"/>
  <path class="edge" d="M580 160V330H638"/><path class="edge" d="M830 370H888"/><path class="edge" d="M1080 370H1138"/><path class="edge" d="M1330 370H1388"/><path class="edge" d="M1580 370H1638"/><path class="edge" d="M1720 330V100H440"/>
  <text class="branch" x="682" y="88">Yes</text><text class="branch" x="600" y="250">No</text>
  <rect class="node" x="20" y="60" width="170" height="80" rx="14"/><rect class="node" x="270" y="60" width="170" height="80" rx="14"/><polygon class="decision" points="580,40 660,100 580,160 500,100"/><rect class="node" x="740" y="60" width="170" height="80" rx="14"/><rect class="node" x="990" y="60" width="170" height="80" rx="14"/><rect class="node" x="1240" y="60" width="170" height="80" rx="14"/>
  <rect class="node" x="640" y="330" width="190" height="80" rx="14"/><rect class="node" x="890" y="330" width="190" height="80" rx="14"/><rect class="node" x="1140" y="330" width="190" height="80" rx="14"/><rect class="node" x="1390" y="330" width="190" height="80" rx="14"/><rect class="node" x="1640" y="330" width="140" height="80" rx="14"/>
  <g class="text"><text x="105" y="103">Business question</text><text x="355" y="94"><tspan x="355">Semantic planner</tspan><tspan x="355" dy="20">and catalog</tspan></text><text x="580" y="96"><tspan x="580">Available in</tspan><tspan x="580" dy="19">certified marts?</tspan></text><text x="825" y="94"><tspan x="825">Guarded read-only</tspan><tspan x="825" dy="20">mart query</tspan></text><text x="1075" y="94"><tspan x="1075">SQL, access, and</tspan><tspan x="1075" dy="20">cost validation</tspan></text><text x="1325" y="94"><tspan x="1325">Answer with</tspan><tspan x="1325" dy="20">provenance</tspan></text><text x="735" y="364"><tspan x="735">Classify metric or</tspan><tspan x="735" dy="20">model gap</tspan></text><text x="985" y="364"><tspan x="985">Specialized</tspan><tspan x="985" dy="20">modeling agents</tspan></text><text x="1235" y="364"><tspan x="1235">Inspect lineage</tspan><tspan x="1235" dy="20">and contracts</tspan></text><text x="1485" y="364"><tspan x="1485">Propose model</tspan><tspan x="1485" dy="20">with tests</tspan></text><text x="1710" y="364"><tspan x="1710">CI and</tspan><tspan x="1710" dy="20">review</tspan></text></g>
</svg>
