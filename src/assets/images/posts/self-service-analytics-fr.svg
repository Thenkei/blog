  <g class="text"><text x="105" y="103">Question métier</text><text x="355" y="94"><tspan x="355">Planner sémantique</tspan><tspan x="355" dy="20">et catalogue</tspan></text><text x="580" y="96"><tspan x="580">Disponible dans</tspan><tspan x="580" dy="19">les marts certifiés ?</tspan></text><text x="825" y="94"><tspan x="825">Requête read-only</tspan><tspan x="825" dy="20">gouvernée</tspan></text><text x="1075" y="94"><tspan x="1075">Validation SQL,</tspan><tspan x="1075" dy="20">accès et coût</tspan></text><text x="1325" y="94"><tspan x="1325">Réponse avec</tspan><tspan x="1325" dy="20">provenance</tspan></text><text x="735" y="364"><tspan x="735">Identifier le gap</tspan><tspan x="735" dy="20">métrique ou modèle</tspan></text><text x="985" y="364"><tspan x="985">Agents de modélisation</tspan><tspan x="985" dy="20">spécialisés</tspan></text><text x="1235" y="364"><tspan x="1235">Inspecter lineage</tspan><tspan x="1235" dy="20">et contrats</tspan></text><text x="1485" y="364"><tspan x="1485">Proposer le modèle</tspan><tspan x="1485" dy="20">avec tests</tspan></text><text x="1710" y="364"><tspan x="1710">CI et</tspan><tspan x="1710" dy="20">revue</tspan></text></g>
</svg>
