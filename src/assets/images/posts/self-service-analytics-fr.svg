<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">Flux d'analytics self-service gouverné</title>
  <desc id="desc">Une question métier est comparée aux marts certifiés ; elle suit une requête read-only gouvernée ou un parcours de modélisation revue avant de revenir au catalogue.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52657a"/></marker><style>.node{fill:#f7f9fc;stroke:#8ea0b3;stroke-width:2}.decision{fill:#fff7e8;stroke:#d58a35;stroke-width:2}.text{fill:#172033;font:600 14px system-ui,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#arrow)}.branch{fill:#9a5a18;font:600 13px system-ui,sans-serif}</style></defs>
  <path class="edge" d="M190 100H248"/><path class="edge" d="M440 100H498"/><path class="edge" d="M660 100H718"/><path class="edge" d="M910 100H968"/><path class="edge" d="M1160 100H1218"/>
  <path class="edge" d="M580 160V330H638"/><path class="edge" d="M830 370H888"/><path class="edge" d="M1080 370H1138"/><path class="edge" d="M1330 370H1388"/><path class="edge" d="M1580 370H1638"/><path class="edge" d="M1720 330V100H440"/>
