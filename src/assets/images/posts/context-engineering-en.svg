<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 240" role="img" aria-labelledby="title desc">
  <title id="title">Context engineering control flow</title>
  <desc id="desc">Task constraints pass through context, relevance, authorization, freshness, and provenance checks before an agent acts and produces evidence.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52657a"/></marker><style>.node{fill:#f7f9fc;stroke:#8ea0b3;stroke-width:2}.text{fill:#172033;font:600 14px system-ui,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <path class="edge" d="M190 110H208"/><path class="edge" d="M390 110H408"/><path class="edge" d="M590 110H608"/><path class="edge" d="M790 110H808"/><path class="edge" d="M990 110H1008"/><path class="edge" d="M1190 110H1208"/><path class="edge" d="M1390 110H1408"/><path class="edge" d="M1590 110H1608"/>
  <g><rect class="node" x="10" y="70" width="180" height="80" rx="14"/><rect class="node" x="210" y="70" width="180" height="80" rx="14"/><rect class="node" x="410" y="70" width="180" height="80" rx="14"/><rect class="node" x="610" y="70" width="180" height="80" rx="14"/><rect class="node" x="810" y="70" width="180" height="80" rx="14"/><rect class="node" x="1010" y="70" width="180" height="80" rx="14"/><rect class="node" x="1210" y="70" width="180" height="80" rx="14"/><rect class="node" x="1410" y="70" width="180" height="80" rx="14"/><rect class="node" x="1610" y="70" width="180" height="80" rx="14"/></g>
  <g class="text"><text x="100" y="102"><tspan x="100">Task and</tspan><tspan x="100" dy="20">constraints</tspan></text><text x="300" y="102"><tspan x="300">Context</tspan><tspan x="300" dy="20">sources</tspan></text><text x="500" y="102"><tspan x="500">Relevance</tspan><tspan x="500" dy="20">filter</tspan></text><text x="700" y="102"><tspan x="700">Authorization and</tspan><tspan x="700" dy="20">policy filter</tspan></text><text x="900" y="102"><tspan x="900">Freshness and</tspan><tspan x="900" dy="20">provenance check</tspan></text><text x="1100" y="102"><tspan x="1100">Prioritized</tspan><tspan x="1100" dy="20">execution context</tspan></text><text x="1300" y="102"><tspan x="1300">Agent</tspan><tspan x="1300" dy="20">action</tspan></text><text x="1500" y="102"><tspan x="1500">Tests, review,</tspan><tspan x="1500" dy="20">and evidence</tspan></text><text x="1700" y="102"><tspan x="1700">Context update</tspan><tspan x="1700" dy="20">or escalation</tspan></text></g>
</svg>
