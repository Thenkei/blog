<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="context-engineering-en-title context-engineering-en-desc">
  <title id="context-engineering-en-title">Context engineering control gate</title>
  <desc id="context-engineering-en-desc">A task enters a bounded context contract, passes state, authority, freshness, and provenance checks, then reaches an agent action and produces proof; a failed gate stops and escalates.</desc>
  <defs>
    <pattern id="context-engineering-en-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" class="inline-grid-line" />
    </pattern>
    <marker id="context-engineering-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow" />
    </marker>
    <marker id="context-engineering-en-arrow-hot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow-hot" />
    </marker>
    <marker id="context-engineering-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" class="inline-arrow-link" />
    </marker>
    <style><![CDATA[
      .inline-paper { fill: var(--visual-surface, #edf3ff); }
      .inline-grid-line { fill: none; stroke: var(--visual-grid, rgba(18,36,63,.08)); stroke-width: 1; }
      .inline-zone { fill: color-mix(in srgb, var(--visual-line, #1d8fe1) 5%, transparent); stroke: color-mix(in srgb, var(--visual-line, #1d8fe1) 42%, transparent); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .inline-node { fill: var(--visual-surface-strong, #fff); stroke: color-mix(in srgb, var(--visual-ink, #12243f) 32%, transparent); stroke-width: 1.5; }
      .inline-node-hot { fill: color-mix(in srgb, var(--visual-hot, #c86c18) 14%, var(--visual-surface-strong, #fff)); stroke: var(--visual-hot, #c86c18); stroke-width: 2; }
      .inline-node-success { fill: color-mix(in srgb, var(--visual-line-secondary, #17aa7b) 12%, var(--visual-surface-strong, #fff)); stroke: var(--visual-line-secondary, #17aa7b); stroke-width: 1.5; }
      .inline-node-danger { fill: color-mix(in srgb, var(--visual-danger, #c63d58) 12%, var(--visual-surface-strong, #fff)); stroke: var(--visual-danger, #c63d58); stroke-width: 1.5; }
      .inline-route { fill: none; stroke: var(--visual-line, #1d8fe1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#context-engineering-en-arrow); }
      .inline-route-muted { stroke: var(--visual-muted, #486189); }
      .inline-route-hot { stroke: var(--visual-hot, #c86c18); marker-end: url(#context-engineering-en-arrow-hot); }
      .inline-route-dashed { stroke: var(--visual-danger, #c63d58); stroke-dasharray: 6 4; marker-end: url(#context-engineering-en-arrow-hot); }
      .inline-arrow { fill: var(--visual-line, #1d8fe1); }
      .inline-arrow-hot { fill: var(--visual-hot, #c86c18); }
      .inline-arrow-link { fill: var(--visual-line-secondary, #17aa7b); }
      .inline-name { fill: var(--visual-ink, #12243f); font: 600 16px var(--font-display, 'Space Grotesk', sans-serif); text-anchor: middle; }
      .inline-detail { fill: var(--visual-muted, #486189); font: 400 12px var(--font-main, 'Manrope', sans-serif); text-anchor: middle; }
      .inline-eyebrow { fill: var(--visual-muted, #486189); font: 500 8px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .16em; }
      .inline-label { fill: var(--visual-muted, #486189); font: 500 8px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .08em; }
      .inline-branch { fill: var(--visual-hot, #c86c18); font: 600 12px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .06em; }
      .inline-mask { fill: var(--visual-surface, #edf3ff); }
      .inline-rule { stroke: color-mix(in srgb, var(--visual-ink, #12243f) 18%, transparent); stroke-width: 1; }
      .inline-legend { fill: var(--visual-muted, #486189); font: 400 8px var(--font-mono, 'IBM Plex Mono', monospace); letter-spacing: .04em; }
    ]]></style>
  </defs>

  <rect width="900" height="480" class="inline-paper" />
  <rect width="900" height="480" fill="url(#context-engineering-en-grid)" opacity=".7" />
  <text x="40" y="36" class="inline-eyebrow">CONTEXT AS AN INTERFACE · CONTROLLED EXECUTION</text>

  <rect x="196" y="80" width="312" height="264" rx="8" class="inline-zone" />
  <rect x="208" y="76" width="156" height="16" rx="2" class="inline-mask" />
  <text x="216" y="88" class="inline-eyebrow">CONTEXT CONTRACT</text>

  <path d="M160 216H188Q196 216 196 208V152H220" class="inline-route inline-route-muted" />
  <path d="M352 176V196" class="inline-route inline-route-muted" />
  <path d="M352 244V264" class="inline-route inline-route-muted" />
  <path d="M484 288H520Q528 288 528 280V220H536" class="inline-route inline-route-muted" />
  <path d="M616 220H648" class="inline-route inline-route-hot" />
  <path d="M788 220H808" class="inline-route" />
  <path d="M576 260V300" class="inline-route inline-route-dashed" />

  <rect x="40" y="180" width="120" height="72" rx="8" class="inline-node" />
  <rect x="220" y="128" width="264" height="48" rx="6" class="inline-node" />
  <rect x="220" y="196" width="264" height="48" rx="6" class="inline-node" />
  <rect x="220" y="264" width="264" height="48" rx="6" class="inline-node" />
  <polygon points="576,180 616,220 576,260 536,220" class="inline-node-hot" />
  <rect x="648" y="180" width="140" height="80" rx="8" class="inline-node-success" />
  <rect x="808" y="180" width="52" height="80" rx="8" class="inline-node-success" />
  <rect x="536" y="300" width="168" height="56" rx="8" class="inline-node-danger" />

  <text x="100" y="208" class="inline-name"><tspan x="100">TASK</tspan><tspan x="100" dy="20">+ INTENT</tspan></text>
  <text x="352" y="150" class="inline-name">CURRENT STATE</text>
  <text x="352" y="218" class="inline-name">SCOPE + AUTHORITY</text>
  <text x="352" y="286" class="inline-name">FRESHNESS + PROVENANCE</text>
  <text x="576" y="216" class="inline-name"><tspan x="576">READY</tspan><tspan x="576" dy="20">?</tspan></text>
  <text x="718" y="212" class="inline-name"><tspan x="718">AGENT</tspan><tspan x="718" dy="20">ACTION</tspan></text>
  <text x="834" y="226" class="inline-name">PROOF</text>
  <text x="620" y="324" class="inline-name"><tspan x="620">STOP /</tspan><tspan x="620" dy="20">ESCALATE</tspan></text>

  <rect x="620" y="188" width="36" height="16" rx="2" class="inline-mask" />
  <text x="628" y="200" class="inline-branch">PASS</text>
  <rect x="588" y="272" width="52" height="16" rx="2" class="inline-mask" />
  <text x="596" y="284" class="inline-branch">BLOCK</text>

  <line x1="40" y1="408" x2="860" y2="408" class="inline-rule" />
  <text x="40" y="436" class="inline-eyebrow">READING KEY</text>
  <line x1="160" y1="432" x2="196" y2="432" class="inline-route" />
  <text x="208" y="436" class="inline-legend">CONTROLLED PATH</text>
  <rect x="372" y="424" width="16" height="16" rx="2" class="inline-node-hot" />
  <text x="400" y="436" class="inline-legend">VALIDATION GATE</text>
  <line x1="584" y1="432" x2="620" y2="432" class="inline-route inline-route-dashed" />
  <text x="632" y="436" class="inline-legend">FAILED CHECK</text>
</svg>
